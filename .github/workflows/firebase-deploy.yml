name: Deploy to Firebase (Hosting + Functions)

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Authenticate to Google Cloud via WIF
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/647376803938/locations/global/workloadIdentityPools/github-provider/providers/github-provider'
          service_account: 'firebase-adminsdk-fbsvc@pwa-test-5lb-magazine.iam.gserviceaccount.com'
          create_credentials_file: true

      - name: Install Dependencies (Root & Functions)
        run: |
          npm ci
          if [ -d "functions" ]; then cd functions && npm ci && cd ..; fi

      - name: Build Project
        run: |
          npm run build
          if [ -d "functions" ]; then cd functions && npm run build --if-present && cd ..; fi

      - name: Deploy Complete App to Firebase
        run: npx firebase-tools deploy --project pwa-test-5lb-magazine
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
