name: Deploy to Firebase (Hosting + Functions)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "firebase-deploy"
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build PWA Frontend & Proxy Function
        run: npm run build

      - name: Install Cloud Function dependencies
        run: |
          cd functions
          npm install
          cd ..

      - name: Authenticate via Google Cloud Service Account
        if: "${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}"
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase
        run: npx firebase-tools deploy --only hosting,functions --project ${{ secrets.FIREBASE_PROJECT_ID || 'pwa-test-5lb-magazine' }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
