    <!-- Google Consent Mode v2 & Google Analytics (gtag.js) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      var savedConsent = null;
      try {
        var raw = localStorage.getItem('5lb_cookie_consent_v1');
        if (raw) savedConsent = JSON.parse(raw);
      } catch(e) {}

      var isAccepted = (savedConsent && savedConsent.analytics === true);

      // Default standard Consent Mode v2: 'denied' finché l'utente non accetta
      gtag('consent', 'default', {
        'analytics_storage': isAccepted ? 'granted' : 'denied',
        'ad_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied'
      });

      gtag('js', new Date());
      gtag('config', 'G-F8YBSNXCDW', {
        'anonymize_ip': true
      });
    </script>
